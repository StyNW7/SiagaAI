<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="preload" as="image" href="/brand/siagaai-logo.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D71920" />
    <meta name="description" content="SiagaAI — PWA berbasis AI yang mengubah data kebencanaan & lingkungan Indonesia menjadi informasi risiko yang personal, mudah dipahami, dan dapat ditindaklanjuti. Kenali Risiko. Pahami Dampaknya. Ambil Tindakan." />
    <meta property="og:title" content="SiagaAI — AI-Powered Personal Disaster Intelligence" />
    <meta property="og:description" content="Know the Risk. Understand the Impact. Take Action. Kecerdasan kebencanaan personal untuk Indonesia." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/og-image.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SiagaAI — Kenali Risiko. Pahami Dampaknya. Ambil Tindakan.</title>
    <script>
      // Apply saved theme & language before first paint (no light flash in dark mode).
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('siaga.settings') || '{}').state || {};
          var t = s.theme || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          if (dark) {
            r.classList.add('dark');
            r.style.colorScheme = 'dark';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E0E0D');
          }
          if (s.lang === 'en') {
            r.lang = 'en';
            document.title = 'SiagaAI — Know the Risk. Understand the Impact. Take Action.';
          }
        } catch (e) {}
      })();

      // Installed-PWA safe areas. Some Android builds (forced edge-to-edge) draw the app under the
      // status bar and the navigation bar while still reporting env(safe-area-inset-*) = 0, which
      // cuts off the header and the bottom navigation. Detect that case and supply fallback insets.
      (function () {
        var r = document.documentElement;
        function apply(reset) {
          if (reset) {
            r.style.removeProperty('--safe-top-fallback');
            r.style.removeProperty('--safe-bottom-fallback');
          }
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
          if (!standalone || !/Android/i.test(navigator.userAgent)) return;
          var probe = document.createElement('div');
          probe.style.cssText =
            'position:fixed;visibility:hidden;pointer-events:none;' +
            'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
          r.appendChild(probe);
          var cs = getComputedStyle(probe);
          var reported = parseFloat(cs.paddingTop) || parseFloat(cs.paddingBottom);
          r.removeChild(probe);
          if (reported) return; // the browser reports real insets — trust them
          // The page fills the whole physical screen, so the system bars are drawn on top of it.
          if (screen.height - window.innerHeight < 20) {
            r.style.setProperty('--safe-top-fallback', '32px');
            r.style.setProperty('--safe-bottom-fallback', '48px');
          }
        }
        try {
          apply(false);
          // Re-check once layout settles; never drop the fallback on a plain resize (keyboard open).
          window.addEventListener('load', function () { apply(false); });
          window.addEventListener('orientationchange', function () {
            setTimeout(function () { apply(true); }, 300);
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>SiagaAI membutuhkan JavaScript untuk berjalan.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
